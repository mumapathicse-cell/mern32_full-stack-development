<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
    <body>
        <div class="flex flex-col items-center justify-center min-h-screen bg-gray-100">
            <h1 class="text-4xl font-bold mb-4">Counter</h1>
            <div class="flex items-center space-x-4">
                <button id="decrement" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">-</button>
                <span id="count" class="text-2xl font-semibold">0</span>
                <button id="increment" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">+</button>
                <button id="reset" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">Reset</button>

            </div>
        </div>

        <script>
            const count = document.getElementById("count");
            const incrementBtn = document.getElementById("increment");
            const decrementBtn = document.getElementById("decrement");
            const resetBtn = document.getElementById("reset");

            incrementBtn.addEventListener("click", function () {
                count.textContent = parseInt(count.textContent, 10) + 1;
            });

            decrementBtn.addEventListener("click", function () {
                count.textContent = parseInt(count.textContent, 10) - 1;
            });

            resetBtn.addEventListener("click", function () {
                count.textContent = "0";
            });
        </script>
    </body>
</html>
