<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basic Form</title>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow" style="width: 350px;">
    <h3 class="text-center mb-4">Login Form</h3>

    <form id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter username" />
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="text" id="email" class="form-control" placeholder="Enter email" />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password" />
      </div>

      <button type="submit" class="btn btn-primary w-100">Submit</button>
    </form>

    <p id="output" class="mt-3 text-center"></p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();

      let username = document.getElementById('username').value.trim();
      let email = document.getElementById('email').value.trim();
      let password = document.getElementById('password').value.trim();
      let output = document.getElementById('output');

      let usernamePattern = /^[A-Za-z][A-Za-z0-9_]{3,11}$/;
      let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      let passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

      if (!usernamePattern.test(username)) {
        output.innerText = 'Username must start with a letter and be 4-12 characters long using letters, numbers, or underscore.';
        output.style.color = 'red';
        return;
      }

      if (!emailPattern.test(email)) {
        output.innerText = 'Please enter a valid email address.';
        output.style.color = 'red';
        return;
      }

      if (!passwordPattern.test(password)) {
        output.innerText = 'Password must be at least 8 characters, include uppercase, lowercase, a number, and a special character.';
        output.style.color = 'red';
        return;
      }

      console.log('Username:', username);
      console.log('Email:', email);
      console.log('Password:', password);

      output.innerText = 'Valid username, email, and password!';
      output.style.color = 'green';
    });
  </script>
</body>
</html>
