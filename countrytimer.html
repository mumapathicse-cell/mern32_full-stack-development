<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class="flex flex-col items-center justify-center min-h-screen bg-gray-100">
        <h1 class="text-4xl font-bold mb-4">Country Timer</h1>

        <div class="bg-white rounded-xl shadow-lg p-8 flex flex-col items-center space-y-5">
            <div class="text-5xl font-bold text-gray-800" id="timer">0</div>

            <div class="flex items-center space-x-4">
                <button id="start" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">Start</button>
                <button id="stop" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">Stop</button>
                <button id="reset" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">Reset</button>
            </div>
        </div>
    </div>

    <script>
        const timer = document.getElementById("timer");
        const startBtn = document.getElementById("start");
        const stopBtn = document.getElementById("stop");
        const resetBtn = document.getElementById("reset");

        let counter = 0;
        let intervalId = null;

        function getInterval() {
            return intervalId;
        }

        function startTimer() {
            if (getInterval() !== null) {
                return;
            }

            intervalId = setInterval(function () {
                counter += 1;
                timer.textContent = counter;
            }, 1000);
        }

        function stopTimer() {
            if (getInterval() !== null) {
                clearInterval(getInterval());
                intervalId = null;
            }
        }

        function resetTimer() {
            stopTimer();
            counter = 0;
            timer.textContent = counter;
        }

        startBtn.addEventListener("click", startTimer);
        stopBtn.addEventListener("click", stopTimer);
        resetBtn.addEventListener("click", resetTimer);
    </script>
</body>

</html>
