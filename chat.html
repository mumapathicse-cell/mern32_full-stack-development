<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">
    <main class="mx-auto flex min-h-screen max-w-6xl overflow-hidden bg-white shadow-xl">
        <aside id="sidebar" class="hidden w-full shrink-0 border-r border-slate-200 bg-slate-50 md:block md:w-80">
            <div class="flex items-center justify-between border-b border-slate-200 px-5 py-5">
                <div>
                    <p class="text-sm font-medium text-indigo-600">Messages</p>
                    <h1 class="text-2xl font-bold tracking-tight">Your chats</h1>
                </div>
                <button type="button" class="rounded-lg p-2 text-slate-500 hover:bg-slate-200" aria-label="New chat">+</button>
            </div>

            <label class="mx-4 mt-4 flex items-center gap-2 rounded-xl bg-white px-3 py-2 text-slate-400 shadow-sm">
                <span aria-hidden="true">⌕</span>
                <input class="w-full bg-transparent text-sm text-slate-700 outline-none" type="search" placeholder="Search chats">
            </label>

            <nav class="space-y-1 p-3" aria-label="Conversations">
                <button class="flex w-full items-center gap-3 rounded-xl bg-indigo-100 px-3 py-3 text-left" type="button">
                    <span class="flex h-11 w-11 items-center justify-center rounded-full bg-indigo-600 font-semibold text-white">AM</span>
                    <span class="min-w-0 flex-1">
                        <span class="flex justify-between gap-2">
                            <strong class="truncate text-sm">Alex Morgan</strong>
                            <small class="text-xs text-slate-500">10:42</small>
                        </span>
                        <span class="block truncate text-xs text-slate-500">That sounds great! See you soon.</span>
                    </span>
                </button>
                <button class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left hover:bg-slate-100" type="button">
                    <span class="flex h-11 w-11 items-center justify-center rounded-full bg-amber-500 font-semibold text-white">JS</span>
                    <span class="min-w-0 flex-1">
                        <span class="flex justify-between gap-2">
                            <strong class="truncate text-sm">Jamie Smith</strong>
                            <small class="text-xs text-slate-500">Yesterday</small>
                        </span>
                        <span class="block truncate text-xs text-slate-500">I will send the files tonight.</span>
                    </span>
                </button>
                <button class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left hover:bg-slate-100" type="button">
                    <span class="flex h-11 w-11 items-center justify-center rounded-full bg-emerald-500 font-semibold text-white">RK</span>
                    <span class="min-w-0 flex-1">
                        <span class="flex justify-between gap-2">
                            <strong class="truncate text-sm">Riya Kapoor</strong>
                            <small class="text-xs text-slate-500">Mon</small>
                        </span>
                        <span class="block truncate text-xs text-slate-500">Thanks for your help!</span>
                    </span>
                </button>
            </nav>
        </aside>

        <section class="flex min-h-screen min-w-0 flex-1 flex-col">
            <header class="flex items-center gap-3 border-b border-slate-200 px-4 py-4 sm:px-6">
                <button id="menuButton" type="button" class="rounded-lg p-2 text-slate-500 hover:bg-slate-100 md:hidden" aria-label="Open conversations">☰</button>
                <span class="flex h-11 w-11 items-center justify-center rounded-full bg-indigo-600 font-semibold text-white">AM</span>
                <div class="min-w-0 flex-1">
                    <h2 class="truncate font-semibold">Alex Morgan</h2>
                    <p class="text-xs text-emerald-600">Online</p>
                </div>
                <button type="button" class="rounded-lg p-2 text-xl text-slate-500 hover:bg-slate-100" aria-label="More options">⋯</button>
            </header>

            <div id="messages" class="flex-1 space-y-5 overflow-y-auto bg-slate-50 px-4 py-6 sm:px-8">
                <p class="text-center text-xs font-medium uppercase tracking-wider text-slate-400">Today</p>
                <div class="flex items-end gap-2">
                    <span class="flex h-8 w-8 items-center justify-center rounded-full bg-indigo-600 text-xs font-semibold text-white">AM</span>
                    <div>
                        <div class="max-w-xs rounded-2xl rounded-bl-md bg-white px-4 py-3 text-sm shadow-sm sm:max-w-md">Hey! Are we still on for lunch today?</div>
                        <time class="mt-1 block text-xs text-slate-400">10:38 AM</time>
                    </div>
                </div>
                <div class="flex items-end justify-end gap-2">
                    <div class="text-right">
                        <div class="max-w-xs rounded-2xl rounded-br-md bg-indigo-600 px-4 py-3 text-left text-sm text-white shadow-sm sm:max-w-md">Absolutely. I found a new place near the office. You will love it.</div>
                        <time class="mt-1 block text-xs text-slate-400">10:40 AM</time>
                    </div>
                </div>
                <div class="flex items-end gap-2">
                    <span class="flex h-8 w-8 items-center justify-center rounded-full bg-indigo-600 text-xs font-semibold text-white">AM</span>
                    <div>
                        <div class="max-w-xs rounded-2xl rounded-bl-md bg-white px-4 py-3 text-sm shadow-sm sm:max-w-md">That sounds great! See you soon.</div>
                        <time class="mt-1 block text-xs text-slate-400">10:42 AM</time>
                    </div>
                </div>
            </div>

            <form id="messageForm" class="flex gap-3 border-t border-slate-200 bg-white p-4 sm:p-5">
                <input id="messageInput" class="min-w-0 flex-1 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" type="text" placeholder="Write a message..." autocomplete="off" required>
                <button class="rounded-xl bg-indigo-600 px-5 py-3 font-semibold text-white transition hover:bg-indigo-700" type="submit">Send</button>
            </form>
        </section>
    </main>

    <script>
        const messageForm = document.getElementById("messageForm");
        const messageInput = document.getElementById("messageInput");
        const messages = document.getElementById("messages");
        const menuButton = document.getElementById("menuButton");
        const sidebar = document.getElementById("sidebar");

        messageForm.addEventListener("submit", function (event) {
            event.preventDefault();
            const message = messageInput.value.trim();
            if (!message) return;

            const messageWrapper = document.createElement("div");
            messageWrapper.className = "flex items-end justify-end gap-2";
            messageWrapper.innerHTML = `
                <div class="text-right">
                    <div class="max-w-xs rounded-2xl rounded-br-md bg-indigo-600 px-4 py-3 text-left text-sm text-white shadow-sm sm:max-w-md"></div>
                    <time class="mt-1 block text-xs text-slate-400">Just now</time>
                </div>`;
            messageWrapper.querySelector("div div").textContent = message;
            messages.appendChild(messageWrapper);
            messageInput.value = "";
            messages.scrollTop = messages.scrollHeight;
        });

        menuButton.addEventListener("click", function () {
            sidebar.classList.toggle("hidden");
        });
    </script>
</body>

</html>
