<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #171717;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.07) 0 2px, transparent 3px),
                radial-gradient(circle at 75% 70%, rgba(255, 255, 255, 0.06) 0 3px, transparent 4px),
                linear-gradient(135deg, transparent 45%, rgba(255, 255, 255, 0.04) 46% 48%, transparent 49%);
            background-size: 54px 54px, 72px 72px, 90px 90px;
        }

        .chat-column {
            background-color: rgba(20, 20, 20, 0.78);
        }
    </style>
</head>

<body class="min-h-screen font-sans text-slate-100">
    <main class="chat-column mx-auto flex min-h-screen w-full max-w-xl flex-col">
        <header class="flex items-center gap-3 border-b border-white/10 px-5 py-5 sm:px-8">
            <span class="relative flex h-12 w-12 items-center justify-center rounded-full bg-sky-500 text-lg font-bold">V<span class="absolute bottom-0 right-0 h-3 w-3 rounded-full border-2 border-slate-900 bg-emerald-400"></span></span>
            <div class="flex-1">
                <h1 class="text-xl font-semibold">Varakumar</h1>
                <p id="status" class="text-sm text-emerald-300">Live chat</p>
            </div>
            <button id="clearButton" class="rounded-lg border border-white/20 px-3 py-2 text-sm text-slate-300 transition hover:bg-white/10" type="button">Clear</button>
        </header>

        <section id="messages" class="flex-1 space-y-5 overflow-y-auto px-5 py-6 sm:px-8" aria-live="polite" aria-label="Chat conversation"></section>

        <form id="messageForm" class="flex gap-3 border-t border-white/10 bg-black/20 p-4 sm:p-5">
            <label class="sr-only" for="messageInput">Type a message</label>
            <input id="messageInput" class="min-w-0 flex-1 rounded-xl border border-white/10 bg-white/10 px-4 py-3 text-white outline-none placeholder:text-slate-400 focus:border-sky-400 focus:ring-2 focus:ring-sky-400/30" type="text" placeholder="Type a message..." autocomplete="off" maxlength="200" required>
            <button class="rounded-xl bg-sky-500 px-5 py-3 font-semibold text-white transition hover:bg-sky-400" type="submit">Send</button>
        </form>
    </main>

    <script>
        const storageKey = "live-chat-messages";
        const messagesElement = document.getElementById("messages");
        const messageForm = document.getElementById("messageForm");
        const messageInput = document.getElementById("messageInput");
        const clearButton = document.getElementById("clearButton");
        const statusElement = document.getElementById("status");
        const channel = "BroadcastChannel" in window ? new BroadcastChannel("live-chat") : null;

        const starterMessages = [
            { text: "Hello Rahul, how are you?", sent: true },
            { text: "Hi Varakumar, I am good. How about you?", sent: false },
            { text: "I'm fine. I published my website recently", sent: true },
            { text: "Oh great Varakumar! Can you send me the URL?", sent: false },
            { text: "https://varakumar.ccbp.tech", sent: true },
            { text: "Awesome Varakumar, where did you learn?", sent: false },
            { text: "NxtWave CCBP 4.0 Program", sent: true }
        ];

        let chatMessages = JSON.parse(localStorage.getItem(storageKey) || "null") || starterMessages;

        function saveMessages() {
            localStorage.setItem(storageKey, JSON.stringify(chatMessages));
            channel?.postMessage(chatMessages);
        }

        function renderMessages() {
            messagesElement.replaceChildren();
            
            chatMessages.forEach(function (message) {
                const messageElement = document.createElement("div");
                messageElement.className = message.sent
                    ? "rounded-xl bg-sky-500 px-5 py-4 text-right text-lg shadow-lg shadow-black/20 sm:text-xl"
                    : "rounded-xl bg-slate-600 px-5 py-4 text-lg shadow-lg shadow-black/20 sm:text-xl";
                messageElement.textContent = message.text;
                messagesElement.appendChild(messageElement);
            });
            messagesElement.scrollTop = messagesElement.scrollHeight;
        }

        messageForm.addEventListener("submit", function (event) {
            event.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;
            chatMessages.push({ text: text, sent: true });
            saveMessages();
            renderMessages();
            messageInput.value = "";
            messageInput.focus();
        });

        clearButton.addEventListener("click", function () {
            chatMessages = [];
            saveMessages();
            renderMessages();
        });

        channel?.addEventListener("message", function (event) {
            chatMessages = event.data;
            renderMessages();
            statusElement.textContent = "Updated just now";
        });

        window.addEventListener("storage", function (event) {
            if (event.key !== storageKey || !event.newValue) return;
            chatMessages = JSON.parse(event.newValue);
            renderMessages();
            statusElement.textContent = "Updated just now";
        });

        renderMessages();
    </script>
</body>

</html>
